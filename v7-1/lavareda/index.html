<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151514">
<title>Lavareda — Entrega Audaz V7.1</title>
<style>html,body{margin:0;min-height:100%;background:#151514;color:#e8e4d6;font-family:Arial,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.boot i{width:8px;height:8px;background:#ff1900;border-radius:50%;display:inline-block;margin-right:10px;animation:pulse .8s ease-in-out infinite alternate}@keyframes pulse{to{transform:scale(1.5);opacity:.55}}</style>
</head>
<body><div class="boot"><span><i></i>Preparando sua entrega</span></div>
<script>
(async()=>{
  try{
    let html=await fetch('../../v7/lavareda/index.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('V7 indisponível');return r.text()});
    html=html.replace('<title>Lavareda — Entrega Audaz V7</title>','<title>Lavareda — Entrega Audaz V7.1</title>');
    html=html.replace('</head>','<link rel="stylesheet" href="../refine.css"></head>');
    html=html.replace(/init\(\);\s*<\/script>/,'window.__audazV7Init=init;<\/script>');
    html=html.replace('</body>','<script src="../refine.js"><\/script></body>');
    document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<div class="boot"><span>Não foi possível carregar a entrega.</span></div>';console.error(e)}
})();
</script></body></html>
