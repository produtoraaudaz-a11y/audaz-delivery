<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071e46"><title>AUDAZ × Estrela do Norte — Match Day Concept</title><style>html,body{margin:0;min-height:100%;background:#080b0f;color:#f4f7fa;font-family:Arial,Helvetica,sans-serif}body{display:grid;place-items:center}.load{font-size:10px;font-weight:900;letter-spacing:.18em;opacity:.7}</style></head><body><div class="load">MATCH DAY CONCEPT · CARREGANDO</div><script>(async()=>{try{const v='20260913-1105';const files=['site.0','site.1','site.2','site.3','site.4'];const [parts,estrelaData]=await Promise.all([Promise.all(files.map(async f=>{const r=await fetch('./'+f+'?v='+v,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);return r.text()})),fetch('./estrela-logo-oficial-user.datauri.txt?v='+v,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('logo '+r.status);return r.text()})]);const b64=parts.join('').trim();const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');let html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();const logo=estrelaData.trim();html=html.replaceAll('../estrela-do-norte/estrela-logo.svg',logo).replaceAll('./estrela-logo-oficial.png',logo);const css=`<style id="matchday-final-patch">

.matchup-vs{width:88px!important;height:88px!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:0!important;grid-template-columns:none!important;font-size:27px!important;letter-spacing:-.12em!important}
.header-estrela-official{object-fit:contain!important;overflow:visible!important}
@media(max-width:900px){.matchup-lockup{grid-template-columns:minmax(0,1fr) 70px minmax(0,1fr)!important;gap:14px!important}.matchup-logo-audaz,.matchup-logo-estrela{width:min(240px,92%)!important}.matchup-vs{width:62px!important;height:62px!important;font-size:20px!important}}
@media(max-width:560px){.matchup-lockup{grid-template-columns:minmax(0,1fr) 48px minmax(0,1fr)!important;gap:8px!important}.matchup-logo-audaz,.matchup-logo-estrela{width:92%!important}.matchup-vs{width:46px!important;height:46px!important;font-size:15px!important}}
</style>`;html=html.replace('</head>',css+'</head>');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load">NÃO FOI POSSÍVEL CARREGAR O CONCEITO.</div>';console.error(e)}})();</script></body></html>
