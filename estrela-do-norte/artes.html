<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071e46"><title>Estrela do Norte — Artes Exclusivas</title><style>html,body{margin:0;min-height:100%;background:#06132b;color:#fff;font-family:Arial,Helvetica,sans-serif}body{display:grid;place-items:center}.load{font-size:10px;font-weight:900;letter-spacing:.18em;opacity:.7}</style></head><body><div class="load">ESTRELA DO NORTE · CARREGANDO ARTES</div><script>(async()=>{try{const b64=(await fetch('./arts.gz.b64',{cache:'no-store'}).then(r=>r.text())).trim();const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load">NÃO FOI POSSÍVEL CARREGAR AS ARTES.</div>';console.error(e)}})();</script></body></html>
