<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071e46"><title>Estrela do Norte — Artes Exclusivas</title><style>html,body{margin:0;min-height:100%;background:#06132b;color:#fff;font-family:Arial,Helvetica,sans-serif}body{display:grid;place-items:center}.load{font-size:10px;font-weight:900;letter-spacing:.18em;opacity:.7}</style></head><body><div class="load">ESTRELA DO NORTE · CARREGANDO ARTES</div><script>(async()=>{try{const v='20260913-final2';const r=await fetch('./arts.gz.b64?v='+v,{cache:'no-store'});if(!r.ok)throw new Error('arts '+r.status);const b64=(await r.text()).trim();const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const source=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();const doc=new DOMParser().parseFromString(source,'text/html');const loader=doc.createElement('script');loader.setAttribute('src','../estrela-catalog-loader.js?v='+v);doc.head.insertBefore(loader,doc.head.firstChild);const logo='../estrela-do-norte-matchday/estrela-logo-oficial.png?v='+v;doc.querySelectorAll('img[alt]').forEach(img=>{if((img.getAttribute('alt')||'').trim().toLowerCase()==='estrela do norte'){img.setAttribute('src',logo);img.removeAttribute('srcset')}});const style=doc.createElement('style');style.textContent='.art-topbar img,.art-footer img{object-fit:contain!important;height:auto!important;max-height:72px!important;max-width:220px!important}.art-footer img{max-height:62px!important}';doc.head.appendChild(style);const html='<!doctype html>'+doc.documentElement.outerHTML;document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load">NÃO FOI POSSÍVEL CARREGAR AS ARTES.</div>';console.error(e)}})();</script></body></html>
