<div id="app" class="app-shell">
  <aside class="sidebar">
    <div class="brand-block">
      <img id="audazLogo" class="audaz-logo" alt="Audaz Produtora">
    </div>
    <nav id="sideNav" class="side-nav"></nav>
    <div class="sidebar-bottom">
      <button class="help-card" data-nav="arquivos">
        <span class="eyebrow">PRECISA DE ALGO?</span>
        <strong>Fale com a Audaz.</strong>
        <small>Arquivos e suporte em um só lugar.</small>
        <span class="arrow">→</span>
      </button>
      <div class="theme-switcher" aria-label="Aparência">
        <button data-theme-mode="system" title="Automático">◐</button>
        <button data-theme-mode="light" title="Claro">☼</button>
        <button data-theme-mode="dark" title="Escuro">●</button>
      </div>

  <header class="mobile-header">

      <button id="mobileMenu" class="icon-btn" aria-label="Abrir menu">☰</button>
    </div>
  </header>

  <main class="main-shell">
    <div class="top-line">
      <div><span class="corner"></span><span class="eyebrow">PORTAL DO CLIENTE</span></div>
      <div id="clientLogo" class="client-logo"></div>
    </div>
    <section id="page-dashboard" class="page active"></section>
    <section id="page-conteudos" class="page"></section>
    <section id="page-calendario" class="page"></section>
    <section id="page-aprovacoes" class="page"></section>
    <section id="page-arquivos" class="page"></section>
  </main>
</div>
<div id="drawer" class="drawer"><div class="drawer-panel"><div class="drawer-head"><strong>MENU</strong><button id="closeDrawer">×</button></div><nav id="drawerNav"></nav></div></div>
