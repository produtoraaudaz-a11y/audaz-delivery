<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151514">
  <title>Lavareda — Entrega Audaz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body data-client="lavareda" data-root="../../">
  <header class="site-header">
    <button class="brand" data-nav="inicio" aria-label="Início"><i></i><b>AUDAZ</b><span>×</span><strong id="headerClient">LAVAREDA</strong></button>
    <nav class="desktop-nav" id="desktopNav"></nav>
    <div class="header-tools">
      <button id="themeButton" class="circle-btn" aria-label="Alternar tema">◐</button>
      <button id="menuButton" class="circle-btn menu-only" aria-label="Abrir menu">☰</button>
    </div>
  </header>

  <main>
    <section id="page-inicio" class="page active"></section>
    <section id="page-entregas" class="page"></section>
    <section id="page-calendario" class="page"></section>
    <section id="page-arquivos" class="page"></section>
    <section id="page-revisao" class="page review-page"></section>
  </main>

  <aside id="menuDrawer" class="drawer" aria-hidden="true">
    <div class="drawer-panel">
      <div class="drawer-top"><span>AUDAZ × LAVAREDA</span><button id="closeMenu">×</button></div>
      <nav id="mobileNav"></nav>
      <small>Um espaço criado pela Audaz para acompanhar suas entregas.</small>
    </div>
  </aside>

  <div id="toast" class="toast" role="status"></div>
  <script src="../app.js"></script>
</body>
</html>
