<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#151514">
  <title>AUDAZ — Portal do Cliente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;1,800;1,900&display=swap" rel="stylesheet">
  <style>:root{--rec:#ff1900;--g:#2b2b29;--o:#e8e4d6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#151514;color:var(--o);font-family:Poppins,Arial,sans-serif;padding:24px}.box{width:min(680px,100%);border:1px solid #e8e4d624;padding:40px}.mark{font-size:38px;font-weight:900;font-style:italic;letter-spacing:-.06em}.mark:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rec);margin-right:-3px;vertical-align:top}.ey{margin-top:34px;color:var(--rec);font-size:10px;letter-spacing:.18em}.box h1{font-size:clamp(34px,7vw,62px);line-height:.96;font-style:italic;margin:12px 0;text-transform:uppercase}.box p{color:#aaa79e;font-size:13px;line-height:1.7;max-width:520px}</style>
</head>
<body><main class="box"><div class="mark">AUDAZ</div><div class="ey">PORTAL DO CLIENTE</div><h1>Experiência de entrega.</h1><p>Este ambiente é acessado pelo link exclusivo de cada projeto. Se você é cliente Audaz, utilize o endereço enviado pela nossa equipe.</p></main></body>
</html>
