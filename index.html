<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#151514">
  <title>AUDAZ — Portal do Cliente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;1,800;1,900&display=swap" rel="stylesheet">
  <style>
    :root{--recording:#ff1900;--graphite:#2b2b29;--offwhite:#e8e4d6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#151514;color:var(--offwhite);font-family:Poppins,Arial,sans-serif}.gate{width:min(620px,calc(100% - 40px));border:1px solid rgba(232,228,214,.16);padding:42px}.gate img{width:210px;height:auto}.dot{width:9px;height:9px;border-radius:50%;background:var(--recording);display:inline-block;margin-right:8px}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--recording);margin-top:40px}.gate h1{font-size:clamp(36px,7vw,68px);line-height:.95;font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:-.06em;margin:12px 0 18px}.gate p{color:#aaa79e;line-height:1.65;font-size:13px;max-width:470px}.gate small{display:block;margin-top:38px;color:#77746d;font-size:10px}
  </style>
</head>
<body>
  <main class="gate"><img src="assets/audaz/logo-dark.png" alt="Audaz Produtora"><div class="eyebrow"><span class="dot"></span>PORTAL DO CLIENTE</div><h1>Seu acesso começa pelo link do seu projeto.</h1><p>Use o endereço enviado pela equipe Audaz para acessar conteúdos, aprovações, calendário e arquivos do seu projeto.</p><small>AUDAZ · EXPERIÊNCIA DE ENTREGA</small></main>
</body>
</html>
